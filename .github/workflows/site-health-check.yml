name: Verificar disponibilidade do site

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar dominio publico do escritorio
        run: |
          curl --fail --silent --show-error --location --retry 2 --retry-delay 5 --max-time 90 --output /dev/null 'https://zordanadvogados.com.br/'
